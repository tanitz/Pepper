<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
    font-family:sans-serif;
    padding:20px;
    gap:0;
}
.query-text {
    color:#8df;
    font-size:26px;
    text-align:center;
    line-height:1.5;
    max-width:90%;
    padding:12px 24px;
    border:2px solid #4488ff44;
    border-radius:16px;
    background:#ffffff08;
    margin-bottom:28px;
}
.query-label {
    color:#6af;
    font-size:18px;
    margin-bottom:6px;
    letter-spacing:1px;
}
.waves { display:flex; align-items:center; gap:10px; height:100px; }
.bar {
    width:14px;
    background:linear-gradient(to top,#ff4e1a,#ffb347);
    border-radius:8px;
    animation:wave 0.7s ease-in-out infinite;
}
.bar:nth-child(1){animation-delay:0.00s}
.bar:nth-child(2){animation-delay:0.10s}
.bar:nth-child(3){animation-delay:0.20s}
.bar:nth-child(4){animation-delay:0.30s}
.bar:nth-child(5){animation-delay:0.20s}
.bar:nth-child(6){animation-delay:0.10s}
.bar:nth-child(7){animation-delay:0.00s}
@keyframes wave {
    0%,100%{height:14px}
    50%{height:80px}
}
.speak-label {
    color:#ff8c42;
    font-size:32px;
    font-weight:bold;
    margin:16px 0 20px;
    letter-spacing:3px;
}
.speech-text {
    color:#fff;
    font-size:30px;
    text-align:center;
    line-height:1.6;
    max-width:90%;
    padding:16px 24px;
    border:2px solid #ff4e1a44;
    border-radius:16px;
    background:#ffffff0f;
}
.reset-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #333;
    color: #fff;
    border: 2px solid #555;
    border-radius: 8px;
    font-size: 18px;
    padding: 6px 16px;
    cursor: pointer;
}
.reset-btn:active { background: #c00; border-color: #f44; }
</style>
</head>
<body>
<div class="query-label">&#x1F3A4; ได้ยินว่า</div>
<div class="query-text" id="query-text"></div>
<div class="waves">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
</div>
<div class="speak-label">&#x1F50A;&nbsp;Speaking...</div>
<div class="speech-text">{TEXT}</div>
<audio id="a" src="/speech.mp3" autoplay></audio>
<button class="reset-btn" onclick="doReset()">&#x23F9; หยุด</button>
<script>
function done(){var x=new XMLHttpRequest();x.open('GET','/audio_done',true);x.send();}
function doReset(){
    var a=document.getElementById('a');
    a.pause();
    a.currentTime=0;
    var x=new XMLHttpRequest();
    x.open('GET','/reset',true);
    x.send();
}
var xhr=new XMLHttpRequest();
xhr.open('GET','/query_text',true);
xhr.onreadystatechange=function(){
    if(xhr.readyState==4&&xhr.status==200)
        document.getElementById('query-text').innerHTML=xhr.responseText;
};
xhr.send();
var a=document.getElementById('a');
a.volume={VOL};
a.addEventListener('ended',done,false);
try{a.play();}catch(e){}
</script>
</body>
</html>
